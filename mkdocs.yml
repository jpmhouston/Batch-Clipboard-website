site_name: Batch Clipboard
site_url: https://batchclipboard.bananameter.lol
repo_url: https://github.com/jpmhouston/Batch-Clipboard
repo_name: Batch Clipboard on GitHub
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to always light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to always dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to automatic light/dark mode
  features:
      - navigation.tabs
      - navigation.tabs.sticky
      - navigation.footer
      - navigation.path
      - search.highlight
      - toc.integrate
  logo: assets/logo.png
  favicon: assets/favicon.ico
  custom_dir: overrides

copyright: Copyright &copy; 2025 Bananameter Labs
extra:
  social:
    - icon: fontawesome/brands/mastodon
      link: https://mastodon.social/@bananameterlabs
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/bananameterlabs.bsky.social
    - icon: fontawesome/brands/twitter
      link: http://twitter.com/bananameterlabs
    - icon: fontawesome/brands/github
      link: https://github.com/jpmhouston/Batch-Clipboard/
    - icon: fontawesome/solid/envelope
      link: mailto:info@bananameter.lol
      name: Email
    - icon: fontawesome/solid/house
      link: https://bananameter.lol
      name: Bananameter Labs homepage

plugins:
  - blog
  - search

