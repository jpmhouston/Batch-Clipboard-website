    - The Batch Clipboard Menu:
      - About the Batch Clipboard Menu: The-Batch-Clipboard-Menu.md
      - Menu-Icon-States.md
      - Special-Menu-Icon-Actions.md
      - Menu-Items.md
      - Batch-Mode-Menu-Items.md
      - Expanded-Menu.md
    - Settings:
      - About Settings: Settings.md
      - General-Panel.md
      - Appearance-Panel.md
      - Support-Us-Panel.md
      - Storage-Panel.md
